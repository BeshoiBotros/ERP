; =============================================================================
; PgBouncer Configuration for Odoo 17 Multi-Tenant SaaS
; =============================================================================
; PgBouncer acts as a connection pooler between Odoo and PostgreSQL.
; It dramatically reduces the number of actual database connections needed,
; preventing connection exhaustion under high tenant load.
; =============================================================================

[databases]
; Wildcard entry: route ALL database connections to the PostgreSQL backend.
; This is essential for multi-tenant Odoo where each tenant has its own database.
; The '*' wildcard means PgBouncer will forward any database name to PostgreSQL.
* = host=postgres port=5432

[pgbouncer]
; --- Connection Settings ---
; Address to listen on (0.0.0.0 = all interfaces inside the container)
listen_addr = 0.0.0.0
listen_port = 6432

; --- Authentication ---
; Use MD5 for compatibility with PostgreSQL 15+ (which defaults to SCRAM-SHA-256)
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; --- Pool Mode ---
; 'transaction' releases connections back to the pool after each transaction.
; This is the ONLY mode compatible with Odoo's standard web workers.
; NOTE: LISTEN/NOTIFY (used by Odoo longpolling) does NOT work in this mode.
; The odoo-worker container connects directly to PostgreSQL for this reason.
pool_mode = transaction

; --- Pool Sizing ---
; Maximum number of client connections allowed (across all databases)
max_client_conn = 200
; Default number of server connections per pool (per user/database pair)
default_pool_size = 25
; Minimum number of server connections to keep open (warm pool)
min_pool_size = 5
; Extra connections to allow when the pool is exhausted (temporary overflow)
reserve_pool_size = 5
; Timeout before using reserve pool connections (seconds)
reserve_pool_timeout = 3

; --- Timeouts ---
; Close server connections idle for more than this many seconds
server_idle_timeout = 300
; Cancel query if it takes longer than this (seconds, 0 = disabled)
query_timeout = 120
; Max time to wait for a connection from the pool (seconds)
client_idle_timeout = 0
; Login timeout for establishing new server connections
server_connect_timeout = 15
server_login_retry = 3

; --- Logging ---
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

; --- Admin/Stats Access ---
admin_users = odoo
stats_users = odoo

; --- Security ---
; Ignore startup parameters that PgBouncer cannot handle
ignore_startup_parameters = extra_float_digits,geqo
