[options]
; =============================================================================
; Odoo 17 - Web/UI Worker Configuration
; =============================================================================
; This configuration is for the user-facing Odoo container.
; It handles web requests, API calls, and serves the UI.
; Cron jobs are DISABLED here — they run on the dedicated worker container.
; =============================================================================

; --- Database Connection (via PgBouncer) ---
db_host = pgbouncer
db_port = 6432
db_user = odoo
db_password = Ch@ng3M3_Str0ng_P@ssw0rd_2026!
db_name = False
db_maxconn = 64
db_sslmode = prefer

; --- Database Security ---
; Tenant isolation via subdomain (re-enable after initial setup)
; dbfilter = ^%d$
; Database manager - set to False after creating first database
list_db = True
; Master admin password for database operations
admin_passwd = S3cur3_@dm1n_M@st3r_P@ss!

; --- Addons Path ---
addons_path = /opt/odoo/extra-addons,/opt/odoo/oca-addons,/usr/lib/python3/dist-packages/odoo/addons,/opt/odoo/custom_addons

; --- Multiprocessing (Workers) ---
; Number of HTTP workers to handle web requests
workers = 4
; DISABLE cron on this container (handled by odoo-worker)
max_cron_threads = 0

; --- Memory Limits (per worker, in bytes) ---
; 640 MB soft limit - worker recycled gracefully after this
limit_memory_soft = 671088640
; 768 MB hard limit - worker killed immediately at this threshold
limit_memory_hard = 805306368

; --- Time Limits (in seconds) ---
; Max CPU time per request
limit_time_cpu = 60
; Max real (wall-clock) time per request
limit_time_real = 120

; --- Reverse Proxy ---
; Trust X-Forwarded-* headers from Traefik
proxy_mode = True

; --- Logging ---
log_level = info
log_handler = :INFO
logfile = None
syslog = False

; --- Performance ---
; Number of records prefetched per query
osv_memory_count_limit = 0

; --- Data Directories ---
data_dir = /var/lib/odoo

; --- Security ---
; Serve static assets behind the reverse proxy
x_sendfile = False

; --- Session Storage (Redis) ---
; Requires session_redis OCA module
; session_redis = True
; session_redis_url = redis://redis:6379/0
; session_redis_prefix = odoo-session
; session_redis_expiration = 86400
