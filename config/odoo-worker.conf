[options]
; =============================================================================
; Odoo 17 - Background Worker Configuration
; =============================================================================
; This configuration is for the dedicated background worker container.
; It handles cron jobs, scheduled actions, and heavy report generation.
; NO web traffic is routed here — the UI is served by odoo-web.
;
; IMPORTANT: This container connects DIRECTLY to PostgreSQL (not PgBouncer)
; because cron uses LISTEN/NOTIFY which requires session-level pooling,
; incompatible with PgBouncer's transaction mode.
; =============================================================================

; --- Database Connection (DIRECT to PostgreSQL) ---
db_host = postgres
db_port = 5432
db_user = odoo
db_password = Ch@ng3M3_Str0ng_P@ssw0rd_2026!
db_name = False
db_maxconn = 16
db_sslmode = prefer

; --- Database Security ---
dbfilter = ^%d$
list_db = False
admin_passwd = S3cur3_@dm1n_M@st3r_P@ss!

; --- Addons Path ---
addons_path = /opt/odoo/extra-addons,/opt/odoo/oca-addons,/usr/lib/python3/dist-packages/odoo/addons,/opt/odoo/custom_addons

; --- Worker Mode ---
; Run in threaded mode (single process) — optimized for background tasks
workers = 0
; Number of cron threads for scheduled actions
max_cron_threads = 2

; --- Memory Limits (per worker, in bytes) ---
; 1 GB soft limit - reports and batch jobs need more memory
limit_memory_soft = 1073741824
; 1.5 GB hard limit - allows heavy PDF/Excel report generation
limit_memory_hard = 1610612736

; --- Time Limits (in seconds) ---
; 5 min CPU time - heavy reports take longer
limit_time_cpu = 300
; 10 min real time - batch operations, large imports, complex reports
limit_time_real = 600

; --- Reverse Proxy ---
proxy_mode = True

; --- Logging ---
log_level = info
log_handler = :INFO
logfile = None
syslog = False

; --- Data Directories ---
data_dir = /var/lib/odoo

; --- HTTP ---
; Disable HTTP server on the worker container (no web traffic)
; The container only processes background jobs
http_enable = True
http_port = 8069
xmlrpc_port = 8069
