# =============================================================================
# DOCKER COMPOSE — Odoo 17 Enterprise SaaS Platform (Nginx Edition)
# =============================================================================

services:

  # ===========================================================================
  # 1. ODOO WEB — UI Workers (User-Facing)
  # ===========================================================================
  odoo-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-odoo-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8069:8069" # Odoo Web UI (Accessible only via Nginx)
      - "127.0.0.1:8072:8072" # Longpolling / WebSocket (Accessible only via Nginx)
    environment:
      - HOST=pgbouncer
      - PORT=6432
      - USER=${POSTGRES_USER}
      - PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - ODOO_ROLE=web
    volumes:
      - ./config/odoo-web.conf:/etc/odoo/odoo.conf:ro
      - odoo-filestore:/var/lib/odoo
      - ./custom_addons:/opt/odoo/custom_addons:ro
    networks:
      - erp_network
    command:
      - "odoo"
      - "--config=/etc/odoo/odoo.conf"
      - "--addons-path=/opt/odoo/extra-addons,/opt/odoo/oca-addons,/usr/lib/python3/dist-packages/odoo/addons,/opt/odoo/custom_addons"
      - "--proxy-mode"
      - "--workers=4"
      - "--max-cron-threads=0"
    deploy:
      resources:
        limits:
          cpus: "${ODOO_WEB_CPU_LIMIT:-2.0}"
          memory: "${ODOO_WEB_MEMORY_LIMIT:-4G}"

  # ===========================================================================
  # 2. ODOO WORKER — Background Processor
  # ===========================================================================
  odoo-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-odoo-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - HOST=postgres
      - PORT=5432
      - USER=${POSTGRES_USER}
      - PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - ODOO_ROLE=worker
    volumes:
      - ./config/odoo-worker.conf:/etc/odoo/odoo.conf:ro
      - odoo-filestore:/var/lib/odoo
      - ./custom_addons:/opt/odoo/custom_addons:ro
    networks:
      - erp_network
    command:
      - "odoo"
      - "--config=/etc/odoo/odoo.conf"
      - "--addons-path=/opt/odoo/extra-addons,/opt/odoo/oca-addons,/usr/lib/python3/dist-packages/odoo/addons,/opt/odoo/custom_addons"
      - "--no-http"
      - "--max-cron-threads=2"
      - "--workers=0"
    deploy:
      resources:
        limits:
          cpus: "${ODOO_WORKER_CPU_LIMIT:-2.0}"
          memory: "${ODOO_WORKER_MEMORY_LIMIT:-4G}"

  # ===========================================================================
  # 3. POSTGRESQL 15 — Primary Database
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: erp-postgres
    restart: unless-stopped
    environment:
      - HOST=postgres
      - PORT=5432
      - USER=${POSTGRES_USER}
      - PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - ODOO_ROLE=web
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - erp_network
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "max_worker_processes=4"
      - "-c"
      - "max_parallel_workers_per_gather=2"
      - "-c"
      - "max_parallel_workers=4"
      - "-c"
      - "max_parallel_maintenance_workers=2"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "log_checkpoints=on"
      - "-c"
      - "log_connections=off"
      - "-c"
      - "log_disconnections=off"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "log_temp_files=0"
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPU_LIMIT:-2.0}"
          memory: "${POSTGRES_MEMORY_LIMIT:-4G}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===========================================================================
  # 4. PGBOUNCER — Connection Pooler
  # ===========================================================================
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: erp-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./config/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    networks:
      - erp_network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U odoo || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # 5. REDIS 7 — Session Store & ORM Cache
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: erp-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - erp_network
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--save"
      - "900 1"
      - "--save"
      - "300 10"
      - "--save"
      - "60 10000"
      - "--loglevel"
      - "warning"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

# =============================================================================
# NETWORKS & VOLUMES
# =============================================================================
networks:
  erp_network:
    driver: bridge
    name: erp_network

volumes:
  postgres-data:
    driver: local
    name: erp_postgres_data
  odoo-filestore:
    driver: local
    name: erp_odoo_filestore
  redis-data:
    driver: local
    name: erp_redis_data
